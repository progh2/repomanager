[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomanager"
version = "0.1.0"
description = "Desktop GUI to list, archive, and delete GitHub repositories in bulk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RepoManager contributors" }]
dependencies = [
    "PySide6>=6.6.0",
    "PyGithub>=2.3.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
repomanager = "repomanager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
