name: Release

# Two ways to produce binaries, both building entirely on GitHub runners:
#
#   1. Actions tab -> Release -> "Run workflow"
#      Builds all four targets. Tick "publish" to also cut a GitHub Release
#      (the tag is created from the run's commit; no local tagging needed).
#   2. git push origin v0.4.0
#      Tag pushes always build and publish.
#
# The in-app updater reads the resulting release, so asset names must keep the
# RepoManager-<version>-<platform>-<arch> shape produced by packaging/build.py.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (otherwise build artifacts only)"
        type: boolean
        default: false
      tag:
        description: "Tag to release as — defaults to v<__version__>"
        type: string
        default: ""
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6" "pillow>=10.0"

      - name: Build executable
        run: python packaging/build.py

      # A build that dies on launch (missing hidden import, missing Qt plugin)
      # must not reach a release. --selftest builds the whole UI and exits, so a
      # failure is a non-zero exit code rather than an error dialog nobody sees.
      - name: Smoke-test the build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN=$(find dist/release -type f ! -name 'SHA256SUMS.txt' | head -1)
          chmod +x "$BIN"
          "$BIN" --selftest

      - name: Smoke-test the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/release -Filter *.exe | Select-Object -First 1).FullName
          # A windowed exe detaches from the console, so wait on it explicitly.
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Output "::error::Packaged app failed --selftest (exit $($proc.ExitCode))"
            exit 1
          }

      # Also proves the .dmg mounts and carries a runnable bundle.
      - name: Smoke-test the build (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          DMG=$(find dist/release -name '*.dmg' | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/rmdmg "$DMG"
          STATUS=0
          /tmp/rmdmg/RepoManager.app/Contents/MacOS/RepoManager --selftest || STATUS=$?
          hdiutil detach /tmp/rmdmg -force || true
          exit $STATUS

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify tag
        id: meta
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/repomanager/__init__.py)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.tag }}"
            [ -n "$TAG" ] || TAG="v$VERSION"
          fi
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ $VERSION in src/repomanager/__init__.py"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from ${GITHUB_SHA:0:7}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and merge checksums
        run: |
          mkdir -p upload
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} upload/ \;
          cat artifacts/*/SHA256SUMS.txt > upload/SHA256SUMS.txt
          ls -lh upload
          cat upload/SHA256SUMS.txt

      - name: Check every platform produced a build
        run: |
          for target in linux-x86_64 windows-x86_64 macos-arm64 macos-x86_64; do
            ls upload/ | grep -q -- "$target" || {
              echo "::error::No asset for $target — refusing to publish a partial release"
              exit 1
            }
          done

      # Published with the preinstalled gh CLI rather than a marketplace action,
      # so this repo can keep Actions restricted to GitHub-owned actions.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(steps.meta.outputs.tag, 'rc') || contains(steps.meta.outputs.tag, 'beta') }}
        run: |
          FLAGS=()
          if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its assets."
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" upload/* \
              --target "$GITHUB_SHA" \
              --title "RepoManager $TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
          gh release view "$TAG" --json url --jq .url
